   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #c16622" x="33.984" y="35.6592" transform="rotate(-0 33.984 35.6592)">PONS: modulates the rhythm</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #155f83" x="33.984" y="165.7584" transform="rotate(-0 33.984 165.7584)">MEDULLA: generates the rhythm</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #193944" transform="translate(61.553852 70.0931)">Pneumotaxic center (PC)</text>
    <text style="font-size: 9.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #193944" transform="translate(83.366742 81.4266)">inhibits the AC</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #193944" transform="translate(68.151898 120.9131)">Apneustic center (AC)</text>
    <text style="font-size: 9.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #193944" transform="translate(78.269398 132.2466)">drives inspiration</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #193944" transform="translate(47.663359 196.55835)">Pre-Bötzinger complex</text>
    <text style="font-size: 9.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #193944" transform="translate(54.158242 207.89185)">autorhythmic: starts</text>
    <text style="font-size: 9.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #193944" transform="translate(71.314648 219.22535)">each breath</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #193944" transform="translate(56.636406 273.80475)">Bötzinger complex</text>
    <text style="font-size: 9.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #193944" transform="translate(64.014492 285.13825)">inhibitory: ends</text>
    <text style="font-size: 9.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #193944" transform="translate(74.4875 296.47175)">inspiration</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #193944" transform="translate(219.289359 196.55835)">Dorsal respiratory group</text>
    <text style="font-size: 9.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #193944" transform="translate(223.683109 207.89185)">(DRG): tidal breathing;</text>
    <text style="font-size: 9.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #193944" transform="translate(237.8485 219.22535)">beside the NTS</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #193944" transform="translate(218.406898 273.80475)">Ventral respiratory group</text>
    <text style="font-size: 9.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #193944" transform="translate(231.687602 285.13825)">(VRG): augmented</text>
    <text style="font-size: 9.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #193944" transform="translate(250.60225 296.47175)">breathing</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #193944" transform="translate(422.871695 141.67275)">Primary muscles</text>
    <text style="font-size: 9.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #193944" transform="translate(433.953297 153.00625)">diaphragm,</text>
    <text style="font-size: 9.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #193944" transform="translate(415.403805 164.33975)">external intercostals</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #193944" transform="translate(416.273648 268.138)">Secondary muscles</text>
    <text style="font-size: 9.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #193944" transform="translate(403.611187 279.4715)">upper airway, neck (SCM,</text>
    <text style="font-size: 9.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #193944" transform="translate(397.543805 290.805)">scalenes), pectorals; internal</text>
    <text style="font-size: 9.5px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; fill: #193944" transform="translate(408.791656 302.1385)">intercostals, abdominal</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.8px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #d22f1e" x="458.064" y="110.8728" transform="rotate(-0 458.064 110.8728)">quiet (eupneic) inspiration</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.8px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: middle; fill: #d22f1e" x="458.064" y="240.972" transform="rotate(-0 458.064 240.972)">augmented inspiration, forced expiration</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.8px; font-family: 'Helvetica Neue', 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #4d4d4d" x="25.056" y="350.7432" transform="rotate(-0 25.056 350.7432)">Arrows excite; bars inhibit. Quiet expiration needs no muscle: the lung recoils back to FRC.</text>
   </g>
  </g>
 </g>
